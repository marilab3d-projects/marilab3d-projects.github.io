<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marilab 3D - Nascita Elegance Solo Foto</title>
    
    <!-- ========================================== -->
    <!-- ✍️ ZONA PERSONALIZZAZIONE (MODIFICA SOLO QUI!) -->
    <!-- ========================================== -->
    <style>
        :root {
            --scritta-dedica: "Benvenuta Piccola Principessa!"; 
            --colore-sfondo: #fce4ec;         /* Delicato Rosa Pastello */
            --colore-dedica: #c2185b;         /* Testo Rosa Scuro */
        }
    </style>
    <!-- ========================================== -->
    <!-- DOPO QUESTA RIGA NON TOCCARE PIÙ NULLA! -->
    <!-- ========================================== -->

    <style>
        body { 
            background-color: var(--colore-sfondo); 
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: Arial, sans-serif; overflow: hidden; position: relative; 
        }
        
        /* ELEMENTI DECORATIVI FISSI */
        .decorazione-fissa { position: absolute; font-size: 32px; z-index: 0; user-select: none; pointer-events: none; opacity: 0.85; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08)); }
        .top-left  { top: 15px; left: 15px; }
        .top-right { top: 15px; right: 15px; }
        .bot-left  { bottom: 30px; left: 30px; }
        .bot-right { bottom: 30px; right: 30px; }
        .fiocco-l  { top: 75px; left: 25px; font-size: 28px; }
        .fiocco-r  { top: 75px; right: 25px; font-size: 28px; }

        .dedica-personale {
            font-family: 'Comic Sans MS', cursive, sans-serif; font-weight: bold; color: var(--colore-dedica); font-size: 22px; text-align: center; margin-top: 30px; margin-bottom: 25px; z-index: 1; text-shadow: 0 1px 2px rgba(255,255,255,0.7); max-width: 75%;
        }
        .carosello { width: 100%; max-width: 500px; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; z-index: 1; margin-top: 10px; }
        .carosello::-webkit-scrollbar { display: none; }
        .slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; justify-content: center; padding: 10px; box-sizing: border-box; }
        .slide img { max-width: 90%; max-height: 55vh; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); object-fit: contain; border: 4px solid #fff; }
    </style>
</head>
<body>

    <!-- ORSACCHIOTTI E FIOCCHETTI FISSI NEI PUNTI STRATEGICI -->
    <div class="decorazione-fissa top-left">🧸</div>
    <div class="decorazione-fissa top-right">🧸</div>
    <div class="decorazione-fissa fiocco-l">🎀</div>
    <div class="decorazione-fissa fiocco-r">🎀</div>
    <div class="decorazione-fissa bot-left">🧸</div>
    <div class="decorazione-fissa bot-right">🧸</div>

    <div class="dedica-personale" id="testoDedica"></div>

    <div class="carosello" id="slider">
        <div class="slide"><img src="foto1.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto2.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto3.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto4.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto5.jpg" onerror="this.parentElement.style.display='none'"></div>
    </div>

    <script>
        const stili = getComputedStyle(document.documentElement);
        const testoD = stili.getPropertyValue('--scritta-dedica').trim().replace(/"/g, "");
        document.getElementById('testoDedica').innerText = testoD;

        const slider = document.getElementById('slider');
        let index = 0;
        setInterval(() => {
            if(slider) {
                const visibili = Array.from(slider.children).filter(c => c.style.display !== 'none');
                if(visibili.length > 0) {
                    index = (index + 1) % visibili.length;
                    slider.scrollTo({ left: slider.clientWidth * index, behavior: 'smooth' });
                }
            }
        }, 5000);
    </script>
</body>
</html>
