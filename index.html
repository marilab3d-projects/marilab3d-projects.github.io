<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marilab 3D - Nascita Boy Premium</title>
    
    <!-- ========================================== -->
    <!-- ✍️ ZONA PERSONALIZZAZIONE (MODIFICA SOLO QUI!) -->
    <!-- ========================================== -->
    <style>
        :root {
            --scritta-dedica: "Benvenuto Piccolo Principe!"; 
            
            /* 📝 DATI DELLA NASCITA DI PROVA */
            --data-nascita: "25 Ottobre 2026";   
            --peso-nascita: "3.400 kg";          
            --altezza-nascita: "51 cm";          

            --colore-sfondo: #e1f5fe;         /* Celeste Cielo Pastello */
            --colore-dedica: #0288d1;         /* Testo Azzurro Scuro */
            --colore-dati: #01579b;           /* Colore per i dati Blu Notte */
        }
    </style>
    <!-- ========================================== -->
    <!-- DOPO QUESTA RIGA NON TOCCARE PIÙ NULLA! -->
    <!-- ========================================== -->

    <style>
        body { 
            background-color: var(--colore-sfondo); 
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: Arial, sans-serif; overflow: hidden; position: relative; 
        }
        
        /* EFFETTO STELLE ARGENTATE BRILLANTI */
        .stella-argento { 
            position: absolute; color: #a6b8c7; pointer-events: none; animation: luccica linear infinite; z-index: 0; opacity: 0;
            filter: drop-shadow(0 0 3px rgba(255,255,255,0.6));
        }
        @keyframes luccica {
            0% { transform: scale(0.3); opacity: 0; }
            50% { opacity: 0.7; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* ELEMENTI DECORATIVI FISSI SOLO IN ALTO */
        .decorazione-fissa { position: absolute; font-size: 32px; z-index: 2; user-select: none; pointer-events: none; opacity: 0.85; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06)); }
        .top-left  { top: 15px; left: 15px; }
        .top-right { top: 15px; right: 15px; }
        .ciuccio-l { top: 75px; left: 25px; font-size: 28px; }
        .ciuccio-r { top: 75px; right: 25px; font-size: 28px; }

        .dedica-personale {
            font-family: 'Comic Sans MS', cursive, sans-serif; font-weight: bold; color: var(--colore-dedica); font-size: 22px; text-align: center; margin-top: 30px; margin-bottom: 5px; z-index: 1; text-shadow: 0 1px 2px rgba(255,255,255,0.7); max-width: 75%;
        }
        
        /* FOTO STRUTTURATA CENTRALE */
        .carosello { width: 100%; max-width: 500px; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; z-index: 1; margin-top: 60px; }
        .carosello::-webkit-scrollbar { display: none; }
        .slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; justify-content: center; padding: 10px; box-sizing: border-box; }
        .slide img { max-width: 90%; max-height: 46vh; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); object-fit: contain; border: 4px solid #fff; }

        /* BLOCCO DATI SCHEMATICO */
        .contenitore-dati {
            display: flex; gap: 15px; justify-content: center; align-items: center; margin-top: 30px; z-index: 1; width: 90%; max-width: 400px;
        }
        .blocco-dato {
            background-color: rgba(255, 255, 255, 0.7); padding: 8px 12px; border-radius: 12px; text-align: center; flex: 1; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid rgba(255,255,255,0.6);
        }
        .titolo-dato { font-size: 10px; text-transform: uppercase; color: var(--colore-dedica); font-weight: bold; letter-spacing: 0.5px; margin-bottom: 3px; }
        .valore-dato { font-size: 14px; font-weight: bold; color: var(--colore-dati); }
    </style>
</head>
<body>

    <!-- DECORAZIONI MASCHIETTO SOLO IN ALTO -->
    <div class="decorazione-fissa top-left">🧸</div>
    <div class="decorazione-fissa top-right">🧸</div>
    <div class="decorazione-fissa ciuccio-l">🍼</div>
    <div class="decorazione-fissa ciuccio-r">🍼</div>

    <div class="dedica-personale" id="testoDedica"></div>

    <div class="carosello" id="slider">
        <div class="slide"><img src="foto1.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto2.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto3.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto4.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto5.jpg" onerror="this.parentElement.style.display='none'"></div>
    </div>

    <div class="contenitore-dati">
        <div class="blocco-dato">
            <div class="titolo-dato">Nascita</div>
            <div class="valore-dato" id="datoData"></div>
        </div>
        <div class="blocco-dato">
            <div class="titolo-dato">Peso</div>
            <div class="valore-dato" id="datoBase"></div>
        </div>
        <div class="blocco-dato">
            <div class="titolo-dato">Altezza</div>
            <div class="valore-dato" id="datoAltezza"></div>
        </div>
    </div>

    <script>
        const stili = getComputedStyle(document.documentElement);
        document.getElementById('testoDedica').innerText = stili.getPropertyValue('--scritta-dedica').trim().replace(/"/g, "");
        
        document.getElementById('datoData').innerText = stili.getPropertyValue('--data-nascita').trim().replace(/"/g, "");
        document.getElementById('datoBase').innerText = stili.getPropertyValue('--peso-nascita').trim().replace(/"/g, "");
        document.getElementById('datoAltezza').innerText = stili.getPropertyValue('--altezza-nascita').trim().replace(/"/g, "");

        const slider = document.getElementById('slider');
        let index = 0;
        setInterval(() => {
            if(slider) {
                const visibili = Array.from(slider.children).filter(c => c.style.display !== 'none');
                if(visibili.length > 0) {
                    index = (index + 1) % visibili.length;
                    slider.scrollTo({ left: slider.clientWidth * index, behavior: 'smooth' });
                }
            }
        }, 5000);

        // Generatore automatico di Stelline d'Argento brillanti
        setInterval(() => {
            const stella = document.createElement('div');
            stella.className = 'stella-argento';
            const tipiStelle = ['✦', '✧', '★'];
            stella.innerText = tipiStelle[Math.floor(Math.random() * tipiStelle.length)];
            
            stella.style.left = Math.random() * 100 + 'vw';
            stella.style.top = Math.random() * 100 + 'vh';
            stella.style.animationDuration = (Math.random() * 2 + 2) + 's';
            stella.style.fontSize = (Math.random() * 6 + 10) + 'px';
            
            document.body.appendChild(stella);
            setTimeout(() => { stella.remove(); }, 4000);
        }, 300);
    </script>
</body>
</html>
