<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marilab 3D - White & Gold Luxury</title>
    
    <!-- ========================================== -->
    <!-- ✍️ ZONA PERSONALIZZAZIONE (MODIFICA SOLO QUI!) -->
    <!-- ========================================== -->
    <style>
        :root {
            --scritta-dedica: "Il nostro giorno dorato"; /* 👈 SCRIVI QUI LA TUA DEDICA */
            --nome-file-musica: "musica.mp3";              /* 👈 CAMBIA QUESTO SE LA MUSICA HA UN ALTRO NOME */
            
            --colore-sfondo: #ffffff;         /* Sfondo Bianco Candido Assoluto */
            --colore-etichetta: #1DB954;      /* Bollino Play (Verde Spotify) */
            --colore-dedica: #b89742;         /* Splendido colore Oro Caldo Satinato per il testo */
        }
    </style>
    <!-- ========================================== -->
    <!-- DOPO QUESTA RIGA NON TOCCARE PIÙ NULLA! -->
    <!-- ========================================== -->

    <style>
        body { 
            background-color: var(--colore-sfondo); 
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: Arial, sans-serif; overflow-x: hidden; position: relative; 
        }
        .dedica-personale {
            font-family: 'Georgia', serif; font-style: italic; color: var(--colore-dedica); font-size: 22px; text-align: center; margin-top: 25px; margin-bottom: 5px; z-index: 1;
        }
        
        /* EFFETTO BRILLANTINI ORO LUCCICANTI */
        .glitter { 
            position: absolute; color: #d4af37; font-size: 11px; pointer-events: none; animation: cadutaGlitter linear infinite; z-index: 0; opacity: 0;
            filter: drop-shadow(0 0 2px rgba(212,175,55,0.4));
        }
        @keyframes cadutaGlitter {
            0% { transform: translateY(-20px) scale(0.6); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(100vh) scale(1.3); opacity: 0; }
        }

        .carosello { width: 100%; max-width: 500px; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; z-index: 1; margin-top: 20px; }
        .carosello::-webkit-scrollbar { display: none; }
        .slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; justify-content: center; padding: 10px; box-sizing: border-box; }
        .slide img { max-width: 95%; max-height: 50vh; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); object-fit: contain; border: 1px solid #eee; }
        
        .player-container { margin-top: auto; margin-bottom: 40px; display: flex; flex-direction: column; align-items: center; z-index: 1; }
        .vinile { 
            width: 140px; height: 140px; 
            background: radial-gradient(circle, #444 2px, #111 4px, #222 20%, #111 40%, #222 60%, #111 80%, #222 100%);
            border-radius: 50%; box-shadow: 0 8px 25px rgba(0,0,0,0.2), inset 0 0 10px rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; border: 2px solid #ddd;
        }
        .etichetta {
            width: 50px; height: 50px; background-color: var(--colore-etichetta); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; font-weight: bold;
            border: 2px solid #111; box-shadow: inset 0 0 5px rgba(0,0,0,0.3); user-select: none; padding-left: 4px; box-sizing: border-box;
        }
        .in-rotazione { animation: giraVinile 3s linear infinite; }
        @keyframes giraVinile { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .istruzione { color: #999; font-size: 11px; margin-top: 10px; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="dedica-personale" id="testoDedica"></div>

    <div class="carosello" id="slider">
        <div class="slide"><img src="foto1.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto2.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto3.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto4.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto5.jpg" onerror="this.parentElement.style.display='none'"></div>
    </div>

    <div class="player-container">
        <div class="vinile" id="discoVinile" onclick="controllaMusica()">
            <div class="etichetta" id="tastoIcona">▶</div>
        </div>
        <div class="istruzione" id="testoStato">🎵 TOCCA IL DISCO PER FARE PLAY</div>
    </div>

    <audio id="mioAudio" preload="auto" loop></audio>

    <script>
        const stili = getComputedStyle(document.documentElement);
        const testoD = stili.getPropertyValue('--scritta-dedica').trim().replace(/"/g, "");
        document.getElementById('testoDedica').innerText = testoD;
        
        const nomeMusica = stili.getPropertyValue('--nome-file-musica').trim().replace(/"/g, "");
        document.getElementById('mioAudio').src = nomeMusica;

        const slider = document.getElementById('slider');
        let index = 0;
        setInterval(() => {
            if(slider) {
                const visibili = Array.from(slider.children).filter(c => c.style.display !== 'none');
                if(visibili.length > 0) {
                    index = (index + 1) % visibili.length;
                    slider.scrollTo({ left: slider.clientWidth * index, behavior: 'smooth' });
                }
            }
        }, 5000);

        function controllaMusica() {
            const audio = document.getElementById('mioAudio');
            const disco = document.getElementById('discoVinile');
            const icona = document.getElementById('tastoIcona');
            const testo = document.getElementById('testoStato');
            const defaultColor = stili.getPropertyValue('--colore-etichetta').trim();
            if (audio.paused) {
                audio.play().then(() => {
                    disco.classList.add('in-rotazione');
                    icona.innerText = "❚❚"; icona.style.paddingLeft = "0px"; icona.style.fontSize = "16px";
                    icona.style.backgroundColor = "#ff0055";
                    testo.innerText = "💿 IN RIPRODUZIONE...";
                }).catch((err) => { console.log(err); });
            } else {
                audio.pause();
                disco.classList.remove('in-rotazione');
                icona.innerText = "▶"; icona.style.paddingLeft = "4px"; icona.style.fontSize = "22px";
                icona.style.backgroundColor = defaultColor;
                testo.innerText = "🎵 DISCO IN PAUSA";
            }
        }

        // Pioggia di Brillantini Dorati eleganti
        setInterval(() => {
            const glitter = document.createElement('div');
            glitter.className = 'glitter';
            const simboli = ['✦', '✧', '★', '•'];
            glitter.innerText = simboli[Math.floor(Math.random() * simboli.length)];
            glitter.style.left = Math.random() * 100 + 'vw';
            glitter.style.animationDuration = (Math.random() * 3 + 4) + 's';
            glitter.style.fontSize = (Math.random() * 6 + 10) + 'px';
            document.body.appendChild(glitter);
            setTimeout(() => { glitter.remove(); }, 7000);
        }, 300);
    </script>

</body>
</html>
