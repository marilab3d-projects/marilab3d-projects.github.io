<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marilab 3D - Luxury Love</title>
    <style>
        /* SFONDO SCURO TEMA LOVE */
        body { 
            background-color: #0d0004; 
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: Arial, sans-serif; overflow-x: hidden; position: relative; 
        }
        
        /* CUORICINI FLUTTUANTI SHINY */
        .cuore { 
            position: absolute; color: #ff3366; font-size: 14px; pointer-events: none; animation: fluttuaCuore linear infinite; z-index: 0; opacity: 0; 
            filter: drop-shadow(0 0 4px rgba(255,51,102,0.6));
        }
        @keyframes fluttuaCuore {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* STRUTTURA CAROSELLO */
        .carosello { width: 100%; max-width: 500px; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; z-index: 1; margin-top: 30px; }
        .carosello::-webkit-scrollbar { display: none; }
        .slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; justify-content: center; padding: 10px; box-sizing: border-box; }
        .slide img { max-width: 95%; max-height: 50vh; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); object-fit: contain; }
        
        /* AREA DISCO VINILE */
        .player-container { margin-top: auto; margin-bottom: 40px; display: flex; flex-direction: column; align-items: center; z-index: 1; }
        .vinile { 
            width: 140px; height: 140px; 
            background: radial-gradient(circle, #2c2c2c 2px, #000 4px, #111 20%, #000 40%, #111 60%, #000 80%, #111 100%);
            border-radius: 50%; box-shadow: 0 8px 20px rgba(0,0,0,0.7), inset 0 0 10px rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; border: 2px solid #222;
        }
        .etichetta {
            width: 50px; height: 50px; background-color: #1DB954; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; font-weight: bold;
            border: 2px solid #000; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); user-select: none; padding-left: 4px; box-sizing: border-box;
        }
        .in-rotazione { animation: giraVinile 3s linear infinite; }
        @keyframes giraVinile { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .istruzione { color: #888; font-size: 12px; margin-top: 10px; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- CAROSELLO VUOTO SAGOMA: LEGGE IN AUTOMATICO LE FOTO CHE CARICHERAI NEL MAGAZZINO -->
    <div class="carosello" id="slider">
        <div class="slide"><img src="foto1.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto2.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto3.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto4.jpg" onerror="this.parentElement.style.display='none'"></div>
        <div class="slide"><img src="foto5.jpg" onerror="this.parentElement.style.display='none'"></div>
    </div>

    <!-- IL VINILE INTERATTIVO CON IL TASTO PLAY -->
    <div class="player-container">
        <div class="vinile" id="discoVinile" onclick="controllaMusica()">
            <div class="etichetta" id="tastoIcona">▶</div>
        </div>
        <div class="istruzione" id="testoStato">🎵 TOCCA IL DISCO PER FARE PLAY</div>
    </div>

    <!-- LETTORE DIETRO LE QUINTE: ABILITA LA MUSICA.MP3 DEL CLIENTE -->
    <audio id="mioAudio" preload="auto" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Gestione Carosello Foto Intelligente (salta i file mancanti)
        const slider = document.getElementById('slider');
        let index = 0;
        setInterval(() => {
            if(slider) {
                const visibili = Array.from(slider.children).filter(c => c.style.display !== 'none');
                if(visibili.length > 0) {
                    index = (index + 1) % visibili.length;
                    slider.scrollTo({ left: slider.clientWidth * index, behavior: 'smooth' });
                }
            }
        }, 5000);

        // Controllo Vinile e Riproduzione Audio
        function controllaMusica() {
            const audio = document.getElementById('mioAudio');
            const disco = document.getElementById('discoVinile');
            const icona = document.getElementById('tastoIcona');
            const testo = document.getElementById('testoStato');
            if (audio.paused) {
                audio.play().then(() => {
                    disco.classList.add('in-rotazione');
                    icona.innerText = "❚❚"; icona.style.paddingLeft = "0px"; icona.style.fontSize = "16px";
                    icona.style.backgroundColor = "#ff0055";
                    testo.innerText = "💿 IN RIPRODUZIONE...";
                }).catch((err) => {
                    console.log("Audio non pronto:", err);
                });
            } else {
                audio.pause();
                disco.classList.remove('in-rotazione');
                icona.innerText = "▶"; icona.style.paddingLeft = "4px"; icona.style.fontSize = "22px";
                icona.style.backgroundColor = "#1DB954";
                testo.innerText = "🎵 DISCO IN PAUSA";
            }
        }

        // Generatore automatico della Cascata di Cuoricini
        setInterval(() => {
            const cuore = document.createElement('div');
            cuore.className = 'cuore';
            cuore.innerText = '♥';
            cuore.style.left = Math.random() * 100 + 'vw';
            cuore.style.animationDuration = (Math.random() * 3 + 5) + 's';
            cuore.style.fontSize = (Math.random() * 8 + 12) + 'px';
            document.body.appendChild(cuore);
            setTimeout(() => { cuore.remove(); }, 8000);
        }, 400);
    </script>

</body>
</html>
